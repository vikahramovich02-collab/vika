<style>
/* Лист визитки: тёмное поле, огромное имя, строки контактов на тонких линейках */
:root{
  --bg:#080c0f; --fg:#eceef0; --dim:#8a9096; --rule:#eceef0; --hair:#2a3036;
  --sans:"Geist","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-weight:400;padding:24px 20px 32px;min-height:100svh;display:flex;flex-direction:column;gap:56px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.meta{display:grid;grid-template-columns:1fr auto;gap:8px 24px;font-size:13px;line-height:1.35;color:var(--dim)}
.meta b{color:var(--fg);font-weight:400;display:inline-flex;align-items:center;gap:8px}
.meta b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg)}
h1{margin:0;font-weight:400;font-size:clamp(64px,17vw,220px);line-height:.86;letter-spacing:-.045em;text-wrap:balance}
.role{margin-top:20px;font-size:clamp(17px,2.4vw,24px);color:var(--dim);max-width:34ch;line-height:1.3}
.rows{margin-top:auto;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:12px;padding:16px 0;border-top:2px solid var(--rule);font-size:clamp(17px,2.6vw,26px);letter-spacing:-.01em;transition:opacity .2s}
.row:last-child{border-bottom:2px solid var(--rule)}
.row span:nth-child(2){color:var(--dim);text-align:center}
.row span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
a.row:hover span:last-child,a.row:focus-visible span:last-child{text-decoration:underline;text-underline-offset:4px}
a.row:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
footer{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:16px}
@media (min-width:900px){body{padding:32px 40px 40px}}
</style>
</head>
<body>
  <div class="meta">
    <b>vika akhramovich</b><span>Minsk</span>
    <span>product · ui/ux · web</span><span>2026©</span>
  </div>

  <header>

    <p class="role">Product designer. Интерфейсы, продукт и веб: от сложного UX до готового фронта.</p>

  </nav>

  <footer><span>designer</span><span>scan · write · build</span></footer>
</body>
